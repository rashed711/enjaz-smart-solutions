<!DOCTYPE html>
<html lang="ar" dir="rtl" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>انجاز للحلول الذكية | Enjaz Smart Solutions</title>
    
    <!-- Keep Tailwind CDN for styling preservation -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@200;300;400;500;700;800;900&display=swap" rel="stylesheet">
    
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Tajawal', 'sans-serif'],
            },
            colors: {
              // Emerald Green (The new Primary) - Fresh, Wealth, Growth
              primary: {
                50: '#ecfdf5',
                100: '#d1fae5',
                200: '#a7f3d0',
                300: '#6ee7b7',
                400: '#34d399',
                500: '#12a16b', // Updated Primary Base Color
                600: '#0e8a5b', // Darker for hover
                700: '#047857',
                800: '#065f46',
                900: '#064e3b',
                950: '#022c22',
              },
              // Midnight Green / Deep Slate (The new Background/Secondary)
              secondary: {
                50: '#f0fdfa',
                100: '#ccfbf1',
                200: '#99f6e4',
                300: '#5eead4',
                400: '#2dd4bf',
                500: '#14b8a6',
                600: '#0d9488',
                700: '#0f766e',
                800: '#115e59',
                900: '#134e4a',
                950: '#042f2e', // Deepest Midnight
              },
              // Dark mode replacements
              midnight: {
                800: '#0f172a',
                900: '#020617',
                950: '#000000',
              }
            },
            backgroundImage: {
              'gradient-radial': 'radial-gradient(var(--tw-gradient-stops))',
              'hero-glow': 'conic-gradient(from 180deg at 50% 50%, #12a16b 0deg, #042f2e 180deg, #12a16b 360deg)',
            },
            animation: {
              'blob': 'blob 7s infinite',
              'float': 'float 6s ease-in-out infinite',
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            },
            keyframes: {
              blob: {
                '0%': { transform: 'translate(0px, 0px) scale(1)' },
                '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                '100%': { transform: 'translate(0px, 0px) scale(1)' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-20px)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      /* Global Performance Optimizations */
      * {
        -webkit-tap-highlight-color: transparent;
      }
      body {
        font-family: 'Tajawal', sans-serif;
        background-color: #ffffff;
        color: #022c22;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      .rtl-flip {
        transform: scaleX(-1);
      }
      
      /* Animation Utilities */
      .reveal-hidden {
        opacity: 0;
        transform: translateY(40px) scale(0.95);
        transition: all 1s cubic-bezier(0.16, 1, 0.3, 1);
        will-change: opacity, transform;
      }
      
      .reveal-visible {
        opacity: 1;
        transform: translateY(0) scale(1);
      }

      /* Ken Burns Effect - Optimized with will-change */
      @keyframes kenBurns {
        0% { transform: scale(1); }
        100% { transform: scale(1.15); }
      }
      .animate-ken-burns {
        animation: kenBurns 20s ease-out infinite alternate;
        will-change: transform;
      }

      /* Neon Glow Effects */
      .neon-text-glow {
        text-shadow: 0 0 20px rgba(18, 161, 107, 0.5);
      }
      .neon-box-glow:hover {
        box-shadow: 0 0 30px rgba(18, 161, 107, 0.3), inset 0 0 10px rgba(18, 161, 107, 0.1);
      }
      
      /* Glassmorphism Classes */
      .glass-panel {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .glass-dark {
        background: rgba(2, 44, 34, 0.7);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }

      /* Mobile Performance Overrides */
      @media (max-width: 768px) {
        .glass-dark, .glass-panel {
          /* Reduce heavy blur on mobile for better FPS */
          backdrop-filter: blur(5px); 
          -webkit-backdrop-filter: blur(5px);
          background: rgba(2, 44, 34, 0.95); /* More solid background */
        }
        .animate-blob {
          animation: none; /* Disable complex blobs on mobile */
          opacity: 0.2;
        }
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 10px;
      }
      ::-webkit-scrollbar-track {
        background: #022c22;
      }
      ::-webkit-scrollbar-thumb {
        background: #12a16b;
        border-radius: 5px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #34d399;
      }
    </style>
